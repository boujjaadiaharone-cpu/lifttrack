<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>LiftTrack</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b0b0d;--card:#17171b;--card2:#202026;--text:#f7f7f8;--muted:#96969f;--accent:#7c5cff;--green:#42d392;--red:#ff5d73;--line:#2b2b31}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}button,input,select{font:inherit}button{border:0;color:inherit}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:20px 18px 12px;position:sticky;top:0;background:linear-gradient(var(--bg) 78%,transparent);z-index:4}.title{font-size:30px;font-weight:800}.sub{color:var(--muted);margin-top:4px}.content{padding:8px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,#17131f,#17171b);border-color:#30274a}.big{font-size:34px;font-weight:800}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card2);padding:14px;border-radius:14px}.stat b{font-size:22px}.btn{background:var(--accent);padding:12px 16px;border-radius:13px;font-weight:700}.btn.secondary{background:var(--card2)}.btn.danger{background:#321b21;color:#ff8797}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,18,21,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:9}.navin{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;padding:11px 3px;color:var(--muted);font-size:12px}.nav button.active{color:#fff}.nav span{display:block;font-size:21px;margin-bottom:2px}.exercise{padding:14px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}.pill{padding:5px 9px;border-radius:99px;background:#292933;color:#c9c9d0;font-size:12px}.inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.input{width:100%;background:#0f0f12;border:1px solid #33333b;color:#fff;padding:10px;border-radius:10px}.check{background:#263f35;color:#71e5ad;padding:10px;border-radius:10px}.bar{height:8px;background:#292930;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:end}.sheet{background:#151519;width:100%;max-width:760px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.full{width:100%}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#eee;color:#111;padding:10px 15px;border-radius:99px;z-index:30;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="lifttrack_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 workouts:[], exercises:[
 {id:"bench",name:"Développé couché",unit:"kg"},
 {id:"squat",name:"Squat",unit:"kg"},
 {id:"row",name:"Rowing",unit:"kg"},
 {id:"ohp",name:"Développé militaire",unit:"kg"},
 {id:"pullup",name:"Tractions",unit:"kg"},
 {id:"dip",name:"Dips",unit:"kg"}
 ], goals:{}, active:null
};
let page="home";
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function lastSets(id){let a=[];db.workouts.forEach(w=>w.exercises?.forEach(e=>{if(e.id===id)e.sets?.forEach(s=>a.push({...s,date:w.date}))}));return a}
function best(id){let a=lastSets(id);return a.length?Math.max(...a.map(x=>+x.weight||0)):0}
function e1rm(w,r){return w*(1+r/30)}
function render(){
 let A=document.getElementById("app");
 A.innerHTML=`<div class="app"><div class="top"><div class="title">LiftTrack</div><div class="sub">${page==="home"?"Ta progression, séance après séance.":page==="workout"?"Séance en cours":page==="progress"?"Tes performances":"Réglages"}</div></div><div class="content">${page==="home"?home():page==="workout"?workout():page==="progress"?progress():settings()}</div></div>
 <div class="nav"><div class="navin">
 <button class="${page==="home"?"active":""}" onclick="go('home')"><span>⌂</span>Accueil</button>
 <button class="${page==="workout"?"active":""}" onclick="go('workout')"><span>＋</span>Séance</button>
 <button class="${page==="progress"?"active":""}" onclick="go('progress')"><span>↗</span>Progression</button>
 <button class="${page==="settings"?"active":""}" onclick="go('settings')"><span>⚙</span>Réglages</button>
 </div></div>`;
}
function home(){
 let recent=db.workouts[0], total=db.workouts.length;
 return `<div class="card hero"><div class="muted">PROGRESSION</div><div class="big">${total} séance${total>1?"s":""}</div><p class="muted">Chaque séance enregistrée compte. L'objectif est de battre progressivement tes performances.</p><button class="btn" onclick="newWorkout()">Commencer une séance</button></div>
 <div class="grid"><div class="stat"><div class="muted">Volume total</div><b>${Math.round(db.workouts.reduce((n,w)=>n+(w.volume||0),0))} kg</b></div><div class="stat"><div class="muted">Dernière séance</div><b>${recent?new Date(recent.date).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}):"—"}</b></div></div>
 <div class="card"><div class="row"><b>Mes exercices</b><button class="btn secondary" onclick="addExercise()">Ajouter</button></div>${db.exercises.map(e=>`<div class="exercise"><div class="row"><div><b>${esc(e.name)}</b><div class="muted">Meilleur poids : ${best(e.id)||"—"} ${e.unit}</div></div><span class="pill">${e.unit}</span></div></div>`).join("")}</div>`;
}
function newWorkout(){db.active={id:Date.now(),date:new Date().toISOString(),exercises:db.exercises.slice(0,4).map(e=>({id:e.id,name:e.name,sets:[]}))};save();go("workout")}
function workout(){
 if(!db.active)return `<div class="empty">Aucune séance en cours.<br><button class="btn" onclick="newWorkout()">Nouvelle séance</button></div>`;
 let vol=db.active.exercises.reduce((n,e)=>n+e.sets.reduce((x,s)=>x+(+s.weight||0)*(+s.reps||0),0),0);
 return `<div class="card"><div class="row"><div><b>${new Date(db.active.date).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</b><div class="muted">Volume : ${Math.round(vol)} kg</div></div><button class="btn secondary" onclick="finish()">Terminer</button></div></div>
 ${db.active.exercises.map((e,ei)=>exerciseCard(e,ei)).join("")}
 <button class="btn secondary full" onclick="chooseExercise()">+ Ajouter un exercice</button>`;
}
function exerciseCard(e,ei){
 let bp=best(e.id), suggested=bp?Math.max(0,bp+(e.id==="pullup"?0:2.5)):0;
 return `<div class="card"><div class="row"><b>${esc(e.name)}</b><span class="pill">Conseil : ${suggested||"à définir"} kg</span></div>
 <div class="muted" style="margin-top:5px">Meilleur poids enregistré : ${bp||"—"} kg</div>
 ${e.sets.map((s,si)=>`<div class="inputs"><input class="input" type="number" step=".5" value="${s.weight}" placeholder="kg" onchange="setVal(${ei},${si},'weight',this.value)"><input class="input" type="number" value="${s.reps}" placeholder="reps" onchange="setVal(${ei},${si},'reps',this.value)"><button class="${s.done?'check':'btn secondary'}" onclick="toggleSet(${ei},${si})">${s.done?"✓":"Série"}</button></div>`).join("")}
 <button class="btn secondary" style="margin-top:10px" onclick="addSet(${ei})">+ Série</button></div>`;
}
function setVal(ei,si,k,v){db.active.exercises[ei].sets[si][k]=v;save()}
function addSet(ei){db.active.exercises[ei].sets.push({weight:"",reps:"",done:false});save();render()}
function toggleSet(ei,si){db.active.exercises[ei].sets[si].done=!db.active.exercises[ei].sets[si].done;save();render()}
function finish(){
 let w=db.active;w.volume=w.exercises.reduce((n,e)=>n+e.sets.reduce((x,s)=>x+(+s.weight||0)*(+s.reps||0),0),0);
 w.exercises.forEach(e=>{e.sets=e.sets.filter(s=>s.weight!==""||s.reps!=="")});
 db.workouts.unshift(w);db.active=null;save();go("home");toast("Séance enregistrée ✓")
}
function chooseExercise(){
 let choices=db.exercises.filter(x=>!db.active.exercises.some(e=>e.id===x.id));
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="m"><div class="sheet"><div class="row"><h2>Ajouter un exercice</h2><button class="btn secondary" onclick="m.remove()">Fermer</button></div>${choices.map(e=>`<button class="card full" style="text-align:left" onclick="db.active.exercises.push({id:'${e.id}',name:'${esc(e.name)}',sets:[]});save();m.remove();render()">${esc(e.name)}</button>`).join("")}</div></div>`)
}
function progress(){
 return `<div class="card"><b>Évolution de tes exercices</b><p class="muted">Le meilleur poids et le 1RM estimé sont calculés à partir de tes séances enregistrées.</p></div>
 ${db.exercises.map(e=>{let sets=lastSets(e.id),b=best(e.id),last=sets.at(-1),one=last?e1rm(+last.weight,+last.reps):0;return `<div class="card"><div class="row"><b>${esc(e.name)}</b><span class="pill">${b||"—"} kg</span></div><div class="grid" style="margin-top:12px"><div class="stat"><div class="muted">Meilleur poids</div><b>${b||"—"} kg</b></div><div class="stat"><div class="muted">1RM estimé</div><b>${one?Math.round(one):"—"} kg</b></div></div><div style="margin-top:14px"><div class="muted">Historique : ${sets.length} série${sets.length>1?"s":""}</div></div></div>`}).join("")}`;
}
function settings(){
 return `<div class="card"><b>Exercices</b><p class="muted">Ajoute les mouvements que tu fais réellement.</p><button class="btn" onclick="addExercise()">Ajouter un exercice</button></div>
 <div class="card"><b>Données</b><p class="muted">Tes données sont enregistrées localement sur cet appareil.</p><button class="btn danger" onclick="resetData()">Réinitialiser toutes les données</button></div>
 <div class="card"><b>Installation iPhone</b><p class="muted">Dans Safari : Partager → Ajouter à l’écran d’accueil. L’app s’ouvrira comme une application.</p></div>`;
}
function addExercise(){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="m"><div class="sheet"><h2>Nouvel exercice</h2><div class="field"><label>Nom</label><input id="en" class="input full" placeholder="Ex. Développé incliné"></div><div class="field"><label>Unité</label><select id="eu" class="input full"><option>kg</option><option>lb</option></select></div><button class="btn full" onclick="createExercise()">Ajouter</button><button class="btn secondary full" style="margin-top:8px" onclick="m.remove()">Annuler</button></div></div>`)
}
function createExercise(){let n=document.getElementById("en").value.trim();if(!n)return;db.exercises.push({id:"x"+Date.now(),name:n,unit:document.getElementById("eu").value});save();m.remove();render()}
function resetData(){if(confirm("Supprimer toutes les séances et exercices personnalisés ?")){localStorage.removeItem(KEY);location.reload()}}
function go(p){page=p;render()}
function toast(s){let x=document.createElement("div");x.className="toast";x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),1800)}
render();
</script>
</body>
</html>
