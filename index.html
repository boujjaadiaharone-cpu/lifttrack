<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fb"><meta name="apple-mobile-web-app-capable" content="yes"><title>LiftTrack V3</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#15161b;--muted:#747783;--line:#e7e8ef;--purple:#6657ff;--purple2:#8a79ff;--green:#22b878;--gold:#f4b740;--shadow:0 10px 28px #1b1d2a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:100px}.top{padding:18px;position:sticky;top:0;background:#f5f6fbea;backdrop-filter:blur(18px);z-index:5}.logo{font-size:28px;font-weight:900;letter-spacing:-1px}.sub{color:var(--muted);font-size:13px}.content{padding:4px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin:12px 0;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#6255ff,#8d7aff);color:#fff;border:0}.hero h1{font-size:29px;margin:5px 0}.muted{color:var(--muted)}.white{color:#e8e5ff}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f0f1f7;padding:14px;border-radius:16px}.stat b{display:block;font-size:23px;margin-top:4px}.btn{background:var(--purple);color:white;border:0;border-radius:14px;padding:12px 16px;font-weight:800}.btn.light{background:#fff;color:var(--purple)}.btn.gray{background:#eff0f5;color:var(--ink)}.full{width:100%}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:10}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;padding:9px;color:#858894;font-size:11px;font-weight:700}.nav button.active{color:var(--purple)}.nav span{font-size:21px;display:block}.rank{display:flex;align-items:center;gap:14px}.badge{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;color:#fff;font-size:28px;font-weight:900;box-shadow:0 8px 18px #0002}.bronze{background:linear-gradient(135deg,#9d5d38,#d28b61)}.silver{background:linear-gradient(135deg,#737985,#c9cdd6)}.gold{background:linear-gradient(135deg,#d69a22,#ffd86a);color:#5c3d00}.mythic{background:linear-gradient(135deg,#d9419b,#754cff)}.legend{background:linear-gradient(135deg,#ff633f,#ffbf43)}.star{background:linear-gradient(135deg,#426dff,#35c7ff)}.pro{background:linear-gradient(135deg,#151827,#5e6480)}.bar{height:10px;background:#e7e8ef;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2));border-radius:99px}.exercise{padding:14px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.inputs{display:grid;grid-template-columns:1fr 1fr 75px;gap:8px;margin-top:9px}.input{width:100%;border:1px solid transparent;background:#f0f1f5;padding:11px;border-radius:12px;outline:none}.input:focus{border-color:var(--purple)}.check{background:#e4f7ee;color:#16875b;border:0;border-radius:12px;font-weight:800}.pill{background:#eeecff;color:var(--purple);border-radius:99px;padding:6px 9px;font-size:11px;font-weight:800}.title{font-size:20px;font-weight:850;margin:20px 2px 8px}.modal{position:fixed;inset:0;background:#16172266;backdrop-filter:blur(5px);z-index:30;display:flex;align-items:end}.sheet{background:white;width:100%;max-width:760px;margin:auto;border-radius:25px 25px 0 0;padding:20px;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#16171d;color:#fff;padding:11px 16px;border-radius:99px;z-index:40;font-weight:800}.small{font-size:13px}.medal{font-size:16px}.table{width:100%;border-collapse:collapse}.table td{padding:9px 4px;border-bottom:1px solid var(--line)}.center{text-align:center}
</style></head><body><div id="app"></div>
<script>
const KEY="lifttrack_v3";let db=JSON.parse(localStorage.getItem(KEY)||"null")||{xp:0,workouts:[],meals:[],water:0,active:null,exercises:[
{id:"bench",name:"Développé couché"},{id:"squat",name:"Squat"},{id:"row",name:"Rowing"},{id:"ohp",name:"Développé militaire"},{id:"pull",name:"Tractions"},{id:"dip",name:"Dips"}]};let page="home";
const ranks=[["Bronze","bronze",0,"🥉"],["Argent","silver",500,"🥈"],["Or","gold",1200,"🥇"],["Mythique","mythic",2200,"✦"],["Légendaire","legend",3600,"♛"],["Star","star",5500,"★"],["Pro","pro",8000,"P"]];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function rank(){let r=ranks[0];for(const x of ranks)if(db.xp>=x[2])r=x;return r}function nextRank(){let i=ranks.findIndex(x=>x[0]===rank()[0]);return ranks[i+1]||null}
function xpGain(w){return Math.max(15,Math.round(Math.sqrt(w||0)*4))}function best(id){let a=[];db.workouts.forEach(w=>w.exercises?.forEach(e=>{if(e.id===id)e.sets?.forEach(s=>{if(+s.weight)a.push(+s.weight)})}));return a.length?Math.max(...a):0}
function go(x){page=x;render()}function toast(s){let x=document.createElement("div");x.className="toast";x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),1800)}
function render(){document.getElementById("app").innerHTML=`<div class="app"><header class="top"><div class="logo">LiftTrack</div><div class="sub">${page==="home"?"Ta progression, ton niveau.":page==="workout"?"Séance en cours":page==="rank"?"Progression de rang":page==="meals"?"Alimentation":"Statistiques"}</div></header><main class="content">${page==="home"?home():page==="workout"?workout():page==="rank"?ranking():page==="meals"?meals():stats()}</main></div><nav class="nav"><div class="navin"><button class="${page==="home"?"active":""}" onclick="go('home')"><span>⌂</span>Accueil</button><button class="${page==="workout"?"active":""}" onclick="go('workout')"><span>＋</span>Séance</button><button class="${page==="rank"?"active":""}" onclick="go('rank')"><span>🏆</span>Rang</button><button class="${page==="meals"?"active":""}" onclick="go('meals')"><span>🍽</span>Repas</button></div></nav>`}
function home(){let r=rank(),n=nextRank(),pct=n?Math.min(100,(db.xp-r[2])/(n[2]-r[2])*100):100;return `<div class="card hero"><div class="white">TON RANG</div><div class="rank" style="margin-top:8px"><div class="badge ${r[1]}">${r[3]}</div><div><h1>${r[0]}</h1><div class="white">${db.xp} XP${n?" · "+(n[2]-db.xp)+" XP avant "+n[0]:" · Rang maximal"}</div></div></div><div class="bar" style="margin-top:16px;background:#ffffff3b"><i style="width:${pct}%;background:#fff"></i></div></div>
<div class="grid"><div class="stat"><div class="muted">Séances</div><b>${db.workouts.length}</b></div><div class="stat"><div class="muted">XP total</div><b>${db.xp}</b></div></div>
<div class="card"><div class="row"><div><b>🏋️ Prêt à progresser ?</b><div class="muted small">Une séance terminée rapporte de l'XP.</div></div><button class="btn" onclick="newWorkout()">Démarrer</button></div></div>
<div class="title">Tes exercices</div><div class="card">${db.exercises.map(e=>`<div class="exercise row"><div><b>${esc(e.name)}</b><div class="muted small">Record : ${best(e.id)||"—"} kg</div></div><span class="pill">+ XP</span></div>`).join("")}</div>`}
function newWorkout(){db.active={date:new Date().toISOString(),exercises:db.exercises.slice(0,4).map(e=>({id:e.id,name:e.name,sets:[]}))};save();go("workout")}
function workout(){if(!db.active)return `<div class="card center">Aucune séance en cours.<br><button class="btn" style="margin-top:12px" onclick="newWorkout()">Nouvelle séance</button></div>`;return `<div class="card"><div class="row"><div><b>Nouvelle séance</b><div class="muted small">${new Date(db.active.date).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</div></div><button class="btn" onclick="finish()">Terminer</button></div></div>${db.active.exercises.map((e,ei)=>`<div class="card"><div class="row"><b>${esc(e.name)}</b><span class="pill">Record ${best(e.id)||"—"} kg</span></div>${e.sets.map((s,si)=>`<div class="inputs"><input class="input" type="number" step=".5" placeholder="kg" value="${s.weight||""}" onchange="val(${ei},${si},'weight',this.value)"><input class="input" type="number" placeholder="reps" value="${s.reps||""}" onchange="val(${ei},${si},'reps',this.value)"><button class="${s.done?'check':'btn gray'}" onclick="done(${ei},${si})">${s.done?"✓":"Série"}</button></div>`).join("")}<button class="btn gray" style="margin-top:10px" onclick="addSet(${ei})">＋ Série</button></div>`).join("")}<button class="btn gray full" onclick="addEx()">＋ Ajouter un exercice</button>`}
function val(a,b,k,v){db.active.exercises[a].sets[b][k]=v;save()}function addSet(i){db.active.exercises[i].sets.push({weight:"",reps:"",done:false});save();render()}function done(a,b){db.active.exercises[a].sets[b].done=!db.active.exercises[a].sets[b].done;save();render()}
function finish(){let w=db.active;w.volume=w.exercises.reduce((n,e)=>n+e.sets.reduce((x,s)=>x+(+s.weight||0)*(+s.reps||0),0);let gain=xpGain(w.volume)+w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length*5,0);w.xp=gain;w.exercises.forEach(e=>e.sets=e.sets.filter(s=>s.weight||s.reps));db.workouts.unshift(w);db.active=null;let before=rank()[0];db.xp+=gain;save();go("home");toast(`+${gain} XP · ${rank()[0]!==before?"Nouveau rang !":"Séance enregistrée ✓"}`)}
function ranking(){let r=rank(),n=nextRank(),pct=n?Math.min(100,(db.xp-r[2])/(n[2]-r[2])*100):100;return `<div class="card"><div class="rank"><div class="badge ${r[1]}">${r[3]}</div><div><h2 style="margin:0">${r[0]}</h2><div class="muted">${db.xp} XP</div></div></div><div class="bar" style="margin-top:18px"><i style="width:${pct}%"></i></div><p class="muted small">${n?`${n[2]-db.xp} XP avant ${n[0]}`:"Tu as atteint le rang Pro."}</p></div>
<div class="title">Les rangs LiftTrack</div>${ranks.map(x=>`<div class="card"><div class="row"><div class="rank"><div class="badge ${x[1]}" style="width:48px;height:48px;border-radius:15px;font-size:21px">${x[3]}</div><div><b>${x[0]}</b><div class="muted small">${x[2]} XP minimum</div></div></div>${db.xp>=x[2]?'<span class="pill">Débloqué</span>':''}</div></div>`).join("")}
<div class="card"><b>Comment gagner de l'XP ?</b><table class="table"><tr><td>Terminer une séance</td><td class="center">+15 XP minimum</td></tr><tr><td>Volume d'entraînement</td><td class="center">selon la séance</td></tr><tr><td>Valider une série</td><td class="center">+5 XP</td></tr></table><p class="muted small">Le système récompense la régularité et la progression, pas la comparaison avec les autres.</p></div>`}
function meals(){return `<div class="card hero"><div class="white">ALIMENTATION</div><h1>Ton journal repas.</h1><div class="white">Photo, aliments, quantités et notes. Simple et sans pression.</div><button class="btn light" style="margin-top:15px" onclick="addMeal()">＋ Ajouter un repas</button></div><div class="grid"><div class="stat"><div class="muted">Repas</div><b>${db.meals.length}</b></div><div class="stat"><div class="muted">Eau</div><b>${db.water} verres</b></div></div><div class="card"><div class="row"><div><b>💧 Hydratation</b><div class="muted small">Repère quotidien simple</div></div><button class="btn gray" onclick="db.water++;save();render()">＋</button></div></div>${db.meals.length?db.meals.map(m=>`<div class="card"><b>${esc(m.name)}</b><div class="muted small">${esc(m.foods||"")}</div>${m.note?`<p class="small">${esc(m.note)}</p>`:""}</div>`).join(""):`<div class="card center muted">Aucun repas enregistré.</div>`}`}
let photo="";function addMeal(){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="m"><div class="sheet"><div class="row"><h2>Nouveau repas</h2><button class="btn gray" onclick="m.remove()">Fermer</button></div><label class="muted small">Photo</label><input id="pf" class="input full" type="file" accept="image/*" capture="environment"><div class="field"><label>Nom</label><input id="mn" class="input full" placeholder="Ex. Poulet, riz, légumes"></div><div class="field"><label>Aliments et quantités</label><textarea id="mf" class="input full" style="height:90px" placeholder="Ex. poulet 150 g..."></textarea></div><div class="field"><label>Note</label><textarea id="nt" class="input full" style="height:70px"></textarea></div><button class="btn full" onclick="mealSave()">Enregistrer</button></div></div>`)}
function mealSave(){db.meals.unshift({date:new Date().toISOString(),name:$("mn").value||"Repas",foods:$("mf").value,note:$("nt").value});save();m.remove();render();toast("Repas enregistré ✓")}
function stats(){return `<div class="title">Statistiques</div><div class="grid"><div class="stat"><div class="muted">Séances</div><b>${db.workouts.length}</b></div><div class="stat"><div class="muted">Volume</div><b>${Math.round(db.workouts.reduce((n,w)=>n+(w.volume||0),0))} kg</b></div></div>${db.exercises.map(e=>`<div class="card"><div class="row"><b>${esc(e.name)}</b><span class="pill">${best(e.id)||"—"} kg</span></div><div class="muted small" style="margin-top:8px">Record personnel enregistré</div></div>`).join("")}`}
function addEx(){let names=db.exercises.map(e=>e.name).join(", ");document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="m"><div class="sheet"><h2>Ajouter un exercice</h2><input id="en" class="input full" placeholder="Nom de l'exercice"><button class="btn full" style="margin-top:12px" onclick="let n=$('en').value.trim();if(n){db.exercises.push({id:'x'+Date.now(),name:n});save();m.remove();render()}">Ajouter</button></div></div>`)}
function $(x){return document.getElementById(x)}render();
</script></body></html>
