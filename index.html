<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LiftTrack">
<title>LiftTrack</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
 --bg:#f6f7fb;--surface:#fff;--surface2:#f0f1f6;--text:#17181d;--muted:#777b88;
 --accent:#635bff;--accent2:#8b7cff;--green:#25b77b;--orange:#ff9f43;--red:#ef5b70;
 --line:#e6e7ed;--shadow:0 10px 30px rgba(28,31,45,.08);--radius:22px
}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
button,input,select,textarea{font:inherit}button{border:0}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:104px}
.header{padding:20px 18px 10px;position:sticky;top:0;z-index:5;background:rgba(246,247,251,.9);backdrop-filter:blur(18px)}
.brand{font-size:28px;font-weight:850;letter-spacing:-1px}.hello{color:var(--muted);font-size:14px;margin-top:3px}
.content{padding:8px 16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin:12px 0;box-shadow:var(--shadow)}
.hero{color:#fff;background:linear-gradient(135deg,#6158ff,#8e79ff);border:0;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.11);right:-45px;top:-55px}
.hero .big{font-size:35px;font-weight:850;letter-spacing:-1px}.big{font-size:30px;font-weight:800}
.muted{color:var(--muted)}.white-muted{color:rgba(255,255,255,.78)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface2);border-radius:17px;padding:14px}.stat b{display:block;font-size:22px;margin-top:4px}
.btn{background:var(--accent);color:white;padding:12px 16px;border-radius:14px;font-weight:750;box-shadow:0 6px 16px rgba(99,91,255,.2)}
.btn.secondary{background:var(--surface2);color:var(--text);box-shadow:none}.btn.green{background:var(--green)}.btn.danger{background:#fff0f2;color:#d43e55;box-shadow:none}.full{width:100%}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:10}
.navin{width:min(760px,100%);margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;color:#8a8d98;padding:10px 3px 12px;font-size:11px;font-weight:650}.nav button.active{color:var(--accent)}.nav span{display:block;font-size:22px;line-height:24px;margin-bottom:2px}
.section-title{font-size:19px;font-weight:800;margin:22px 3px 8px}.pill{background:#eeeefe;color:var(--accent);padding:6px 9px;border-radius:99px;font-size:12px;font-weight:700}
.exercise{padding:14px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}
.inputs{display:grid;grid-template-columns:1fr 1fr 82px;gap:8px;margin-top:10px}.input{width:100%;background:var(--surface2);border:1px solid transparent;color:var(--text);padding:11px;border-radius:12px;outline:none}.input:focus{border-color:var(--accent)}
.check{background:#e7f8f0;color:#14895b;padding:11px;border-radius:12px;font-weight:800}
.bar{height:9px;background:#e9eaf0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.photo{height:190px;border-radius:17px;background:linear-gradient(135deg,#ececf5,#f8f8fb);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:12px;color:var(--muted)}
.photo img{width:100%;height:100%;object-fit:cover}.meal{display:flex;gap:12px;align-items:center}.thumb{width:64px;height:64px;border-radius:15px;object-fit:cover;background:var(--surface2)}
.iconbox{width:44px;height:44px;border-radius:14px;background:#eeecff;display:grid;place-items:center;font-size:21px}
.modal{position:fixed;inset:0;background:rgba(20,20,28,.45);backdrop-filter:blur(5px);z-index:30;display:flex;align-items:flex-end}.sheet{background:var(--surface);width:100%;max-width:760px;margin:auto;border-radius:26px 26px 0 0;padding:20px;max-height:91vh;overflow:auto}.sheet h2{margin:0 0 15px}
.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px;font-weight:650}.textarea{min-height:90px;resize:vertical}
.empty{text-align:center;padding:38px 14px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#17181d;color:white;padding:11px 16px;border-radius:99px;z-index:40;font-weight:750;box-shadow:var(--shadow)}
.small{font-size:13px}.trend{font-size:13px;color:var(--green);font-weight:700}
@media(max-width:390px){.inputs{grid-template-columns:1fr 1fr 70px}.card{padding:15px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="lifttrack_v2";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
 workouts:[],meals:[],water:0,exercises:[
 {id:"bench",name:"Développé couché",unit:"kg"},{id:"squat",name:"Squat",unit:"kg"},
 {id:"row",name:"Rowing",unit:"kg"},{id:"ohp",name:"Développé militaire",unit:"kg"},
 {id:"pullup",name:"Tractions",unit:"kg"},{id:"dip",name:"Dips",unit:"kg"}],active:null
};
let page="home";
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function go(p){page=p;render()}
function lastSets(id){let a=[];db.workouts.forEach(w=>w.exercises?.forEach(e=>{if(e.id===id)e.sets?.forEach(s=>{if(s.weight!==""||s.reps!=="")a.push({...s,date:w.date})})}));return a}
function best(id){let a=lastSets(id);return a.length?Math.max(...a.map(x=>+x.weight||0)):0}
function e1rm(w,r){return w*(1+r/30)}
function render(){
 document.getElementById("app").innerHTML=`<div class="app">
 <header class="header"><div class="brand">LiftTrack</div><div class="hello">${page==="home"?"Ton suivi, au même endroit.":page==="workout"?"Séance en cours":page==="meals"?"Alimentation & habitudes":"Progression & réglages"}</div></header>
 <main class="content">${page==="home"?home():page==="workout"?workout():page==="meals"?meals():progress()}</main></div>
 <nav class="nav"><div class="navin">
 <button class="${page==="home"?"active":""}" onclick="go('home')"><span>⌂</span>Accueil</button>
 <button class="${page==="workout"?"active":""}" onclick="go('workout')"><span>＋</span>Séance</button>
 <button class="${page==="meals"?"active":""}" onclick="go('meals')"><span>🍽</span>Repas</button>
 <button class="${page==="progress"?"active":""}" onclick="go('progress')"><span>↗</span>Progression</button>
 </div></nav>`;
}
function home(){
 let recent=db.workouts[0],vol=db.workouts.reduce((n,w)=>n+(w.volume||0),0),mealCount=db.meals.length;
 return `<section class="card hero"><div class="white-muted">BIENVENUE SUR LIFTTRACK</div><div class="hero big" style="margin:6px 0 8px">Construis ta progression.</div><div class="white-muted">Enregistre tes séances, tes performances et tes repas sans classement inutile.</div><div style="margin-top:16px"><button class="btn" style="background:#fff;color:#5d55ee" onclick="newWorkout()">Commencer une séance</button></div></section>
 <div class="grid"><div class="stat"><div class="muted">Séances</div><b>${db.workouts.length}</b></div><div class="stat"><div class="muted">Volume cumulé</div><b>${Math.round(vol)} kg</b></div></div>
 <div class="grid"><div class="stat"><div class="muted">Repas enregistrés</div><b>${mealCount}</b></div><div class="stat"><div class="muted">Eau aujourd'hui</div><b>${db.water} verres</b></div></div>
 <div class="section-title">Accès rapide</div>
 <div class="card"><div class="row"><div><b>🏋️ Nouvelle séance</b><div class="muted small">Poids, reps et séries</div></div><button class="btn" onclick="newWorkout()">Démarrer</button></div></div>
 <div class="card"><div class="row"><div><b>🍽️ Ajouter un repas</b><div class="muted small">Photo, aliments, quantités et notes</div></div><button class="btn secondary" onclick="addMeal()">Ajouter</button></div></div>
 <div class="section-title">Tes exercices</div>
 <div class="card">${db.exercises.slice(0,5).map(e=>`<div class="exercise"><div class="row"><div><b>${esc(e.name)}</b><div class="muted small">Meilleur poids : ${best(e.id)||"—"} ${e.unit}</div></div><span class="pill">${e.unit}</span></div></div>`).join("")}</div>`;
}
function newWorkout(){db.active={id:Date.now(),date:new Date().toISOString(),exercises:db.exercises.slice(0,4).map(e=>({id:e.id,name:e.name,sets:[]}))};save();go("workout")}
function workout(){
 if(!db.active)return `<div class="empty">Aucune séance en cours.<br><button class="btn" style="margin-top:12px" onclick="newWorkout()">Nouvelle séance</button></div>`;
 let vol=db.active.exercises.reduce((n,e)=>n+e.sets.reduce((x,s)=>x+(+s.weight||0)*(+s.reps||0),0),0);
 return `<div class="card"><div class="row"><div><b>${new Date(db.active.date).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</b><div class="muted small">Volume : ${Math.round(vol)} kg</div></div><button class="btn green" onclick="finish()">Terminer</button></div></div>
 ${db.active.exercises.map((e,ei)=>exerciseCard(e,ei)).join("")}
 <button class="btn secondary full" onclick="chooseExercise()">＋ Ajouter un exercice</button>`;
}
function exerciseCard(e,ei){
 let bp=best(e.id),suggest=bp?bp+(e.id==="pullup"?0:2.5):0;
 return `<div class="card"><div class="row"><div><b>${esc(e.name)}</b><div class="muted small">Meilleur : ${bp||"—"} kg</div></div><span class="pill">${suggest?`Proposition ${suggest} kg`:"Commence léger"}</span></div>
 ${e.sets.map((s,si)=>`<div class="inputs"><input class="input" type="number" step=".5" value="${esc(s.weight)}" placeholder="kg" onchange="setVal(${ei},${si},'weight',this.value)"><input class="input" type="number" value="${esc(s.reps)}" placeholder="reps" onchange="setVal(${ei},${si},'reps',this.value)"><button class="${s.done?'check':'btn secondary'}" onclick="toggleSet(${ei},${si})">${s.done?"✓":"Série"}</button></div>`).join("")}
 <button class="btn secondary" style="margin-top:10px" onclick="addSet(${ei})">＋ Série</button></div>`;
}
function setVal(ei,si,k,v){db.active.exercises[ei].sets[si][k]=v;save()}
function addSet(ei){db.active.exercises[ei].sets.push({weight:"",reps:"",done:false});save();render()}
function toggleSet(ei,si){db.active.exercises[ei].sets[si].done=!db.active.exercises[ei].sets[si].done;save();render()}
function finish(){
 let w=db.active;w.volume=w.exercises.reduce((n,e)=>n+e.sets.reduce((x,s)=>x+(+s.weight||0)*(+s.reps||0),0);w.exercises.forEach(e=>e.sets=e.sets.filter(s=>s.weight!==""||s.reps!==""));
 db.workouts.unshift(w);db.active=null;save();go("home");toast("Séance enregistrée ✓")
}
function chooseExercise(){
 let choices=db.exercises.filter(x=>!db.active.exercises.some(e=>e.id===x.id));
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="m"><div class="sheet"><div class="row"><h2>Ajouter un exercice</h2><button class="btn secondary" onclick="m.remove()">Fermer</button></div>${choices.map(e=>`<button class="card full" style="text-align:left" onclick="db.active.exercises.push({id:'${e.id}',name:'${esc(e.name)}',sets:[]});save();m.remove();render()">${esc(e.name)}</button>`).join("")}</div></div>`)
}
function meals(){
 let today=new Date().toDateString(),todayMeals=db.meals.filter(m=>new Date(m.date).toDateString()===today);
 return `<section class="card hero"><div class="white-muted">ALIMENTATION</div><div class="big" style="margin:6px 0 8px">Mange avec plus de recul.</div><div class="white-muted">Ajoute une photo, les aliments, les quantités et tes observations. Pas de classement, pas de pression.</div><div style="margin-top:15px"><button class="btn" style="background:#fff;color:#5d55ee" onclick="addMeal()">＋ Ajouter un repas</button></div></section>
 <div class="grid"><div class="stat"><div class="muted">Repas aujourd'hui</div><b>${todayMeals.length}</b></div><div class="stat"><div class="muted">Hydratation</div><b>${db.water} verres</b></div></div>
 <div class="card"><div class="row"><div><b>💧 Hydratation</b><div class="muted small">Un repère simple, sans calcul de calories.</div></div><button class="btn secondary" onclick="addWater()">＋ Verre</button></div><div style="margin-top:14px" class="bar"><i style="width:${Math.min(db.water/8*100,100)}%"></i></div></div>
 <div class="section-title">Mes repas</div>
 ${db.meals.length?db.meals.map(m=>`<div class="card"><div class="meal">${m.photo?`<img class="thumb" src="${m.photo}">`:`<div class="iconbox">🍽️</div>`}<div style="flex:1"><b>${esc(m.name)}</b><div class="muted small">${new Date(m.date).toLocaleDateString("fr-FR",{day:"2-digit",month:"long"})} · ${esc(m.foods||"")}</div>${m.note?`<div class="small" style="margin-top:4px">${esc(m.note)}</div>`:""}</div></div></div>`).join(""):`<div class="card empty">Aucun repas enregistré.<br>Ajoute ton premier repas avec une photo.</div>`}`;
}
function addMeal(){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="m"><div class="sheet"><div class="row"><h2>Nouveau repas</h2><button class="btn secondary" onclick="m.remove()">Fermer</button></div>
 <div class="field"><label>Photo du repas</label><input id="photo" class="input full" type="file" accept="image/*" capture="environment" onchange="previewPhoto(event)"><div id="preview" class="photo">📷 Ajouter une photo</div></div>
 <div class="field"><label>Nom du repas</label><input id="mn" class="input full" placeholder="Ex. Poulet, riz et légumes"></div>
 <div class="field"><label>Aliments et quantités</label><textarea id="mf" class="input full textarea" placeholder="Ex. poulet 150 g, riz 200 g, légumes..."></textarea></div>
 <div class="field"><label>Commentaire</label><textarea id="note" class="input full" placeholder="Faim, énergie, repas avant/après entraînement..."></textarea></div>
 <button class="btn full" onclick="createMeal()">Enregistrer le repas</button></div></div>`)
}
let photoData="";
function previewPhoto(ev){let f=ev.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{photoData=r.result;$("preview").innerHTML=`<img src="${photoData}">`};r.readAsDataURL(f)}
function createMeal(){
 let name=$("mn").value.trim()||"Repas";db.meals.unshift({id:Date.now(),date:new Date().toISOString(),name,foods:$("mf").value.trim(),note:$("note").value.trim(),photo:photoData});save();photoData="";m.remove();go("meals");toast("Repas enregistré ✓")
}
function addWater(){db.water++;save();render();toast("Hydratation +1")}
function progress(){
 return `<div class="section-title">Progression</div>
 <div class="card"><div class="row"><div><b>Régularité</b><div class="muted small">Séances enregistrées</div></div><div class="big">${db.workouts.length}</div></div><div style="margin-top:14px" class="bar"><i style="width:${Math.min(db.workouts.length/12*100,100)}%"></i></div></div>
 ${db.exercises.map(e=>{let s=lastSets(e.id),b=best(e.id),last=s.at(-1),one=last?e1rm(+last.weight,+last.reps):0;return `<div class="card"><div class="row"><div><b>${esc(e.name)}</b><div class="muted small">${s.length} série${s.length>1?"s":""} enregistrée${s.length>1?"s":""}</div></div><span class="pill">${b||"—"} kg</span></div><div class="grid" style="margin-top:12px"><div class="stat"><div class="muted">Meilleur poids</div><b>${b||"—"} kg</b></div><div class="stat"><div class="muted">1RM estimé</div><b>${one?Math.round(one):"—"} kg</b></div></div></div>`}).join("")}
 <div class="section-title">Exercices</div><div class="card"><button class="btn full" onclick="addExercise()">＋ Ajouter un exercice</button><div style="margin-top:10px">${db.exercises.map(e=>`<div class="exercise row"><b>${esc(e.name)}</b><span class="muted">${e.unit}</span></div>`).join("")}</div></div>
 <div class="card"><b>Stockage</b><p class="muted small">Les données restent enregistrées localement sur cet appareil. Si tu effaces les données du navigateur, elles peuvent être perdues.</p><button class="btn danger full" onclick="resetData()">Réinitialiser les données</button></div>`;
}
function addExercise(){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="m"><div class="sheet"><h2>Nouvel exercice</h2><div class="field"><label>Nom</label><input id="en" class="input full" placeholder="Ex. Développé incliné"></div><button class="btn full" onclick="createExercise()">Ajouter</button><button class="btn secondary full" style="margin-top:8px" onclick="m.remove()">Annuler</button></div></div>`)
}
function createExercise(){let n=$("en").value.trim();if(!n)return;db.exercises.push({id:"x"+Date.now(),name:n,unit:"kg"});save();m.remove();render();toast("Exercice ajouté")}
function resetData(){if(confirm("Supprimer les données LiftTrack sur cet appareil ?")){localStorage.removeItem(KEY);location.reload()}}
function toast(s){let x=document.createElement("div");x.className="toast";x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),1800)}
render();
</script>
</body>
</html>
