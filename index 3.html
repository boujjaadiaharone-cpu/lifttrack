<div class="card"><div class="row"><div><b>🏋️ Prêt à progresser ?</b><div class="muted small">Une séance terminée rapporte de l'XP.</div></div><button class="btn" onclick="newWorkout()">Démarrer</button></div></div>
<div class="title">Tes exercices</div><div class="card">${db.exercises.map(e=>`<div class="exercise row"><div><b>${esc(e.name)}</b><div class="muted small">Record : ${best(e.id)||"—"} kg</div></div><span class="pill">+ XP</span></div>`).join("")}</div>`}
function newWorkout(){db.active={date:new Date().toISOString(),exercises:db.exercises.slice(0,4).map(e=>({id:e.id,name:e.name,sets:[]}))};save();go("workout")}
function workout(){if(!db.active)return `<div class="card center">Aucune séance en cours.<br><button class="btn" style="margin-top:12px" onclick="newWorkout()">Nouvelle séance</button></div>`;return `<div class="card"><div class="row"><div><b>Nouvelle séance</b><div class="muted small">${new Date(db.active.date).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</div></div><button class="btn" onclick="finish()">Terminer</button></div></div>${db.active.exercises.map((e,ei)=>`<div class="card"><div class="row"><b>${esc(e.name)}</b><span class="pill">Record ${best(e.id)||"—"} kg</span></div>${e.sets.map((s,si)=>`<div class="inputs"><input class="input" type="number" step=".5" placeholder="kg" value="${s.weight||""}" onchange="val(${ei},${si},'weight',this.value)"><input class="input" type="number" placeholder="reps" value="${s.reps||""}" onchange="val(${ei},${si},'reps',this.value)"><button class="${s.done?'check':'btn gray'}" onclick="done(${ei},${si})">${s.done?"✓":"Série"}</button></div>`).join("")}<button class="btn gray" style="margin-top:10px" onclick="addSet(${ei})">＋ Série</button></div>`).join("")}<button class="btn gray full" onclick="addEx()">＋ Ajouter un exercice</button>`}
function val(a,b,k,v){db.active.exercises[a].sets[b][k]=v;save()}function addSet(i){db.active.exercises[i].sets.push({weight:"",reps:"",done:false});save();render()}function done(a,b){db.active.exercises[a].sets[b].done=!db.active.exercises[a].sets[b].done;save();render()}
function finish(){let w=db.active;w.volume=w.exercises.reduce((n,e)=>n+e.sets.reduce((x,s)=>x+(+s.weight||0)*(+s.reps||0),0),0);let gain=xpGain(w.volume)+w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length*5,0);w.xp=gain;w.exercises.forEach(e=>e.sets=e.sets.filter(s=>s.weight||s.reps));db.workouts.unshift(w);db.active=null;let before=rank()[0];db.xp+=gain;save();go("home");toast(`+${gain} XP · ${rank()[0]!==before?"Nouveau rang !":"Séance enregistrée ✓"}`)}
function ranking(){let r=rank(),n=nextRank(),pct=n?Math.min(100,(db.xp-r[2])/(n[2]-r[2])*100):100;return `<div class="card"><div class="rank"><div class="badge ${r[1]}">${rankIcon(r[0])}</div><div><h2 style="margin:0">${r[0]}</h2><div class="muted">${db.xp} XP</div></div></div><div class="bar" style="margin-top:18px"><i style="width:${pct}%"></i></div><p class="muted small">${n?`${n[2]-db.xp} XP avant ${n[0]}`:"Tu as atteint le rang Pro."}</p></div>
<div class="title">Les rangs LiftTrack</div>${ranks.map(x=>`<div class="card"><div class="row"><div class="rank"><div class="badge ${x[1]}" style="width:58px;height:58px;border-radius:17px;font-size:21px">${rankIcon(x[0])}</div><div><b>${x[0]}</b><div class="muted small">${x[2]} XP minimum</div></div></div>${db.xp>=x[2]?'<span class="pill">Débloqué</span>':''}</div></div>`).join("")}
<div class="card"><b>Comment gagner de l'XP ?</b><table class="table"><tr><td>Terminer une séance</td><td class="center">+15 XP minimum</td></tr><tr><td>Volume d'entraînement</td><td class="center">selon la séance</td></tr><tr><td>Valider une série</td><td class="center">+5 XP</td></tr></table><p class="muted small">Le système récompense la régularité et la progression, pas la comparaison avec les autres.</p></div>`}
function meals(){return `<div class="card hero"><div class="white">ALIMENTATION</div><h1>Ton journal repas.</h1><div class="white">Photo, aliments, quantités et notes. Simple et sans pression.</div><button class="btn light" style="margin-top:15px" onclick="addMeal()">＋ Ajouter un repas</button></div><div class="grid"><div class="stat"><div class="muted">Repas</div><b>${db.meals.length}</b></div><div class="stat"><div class="muted">Eau</div><b>${db.water} verres</b></div></div><div class="card"><div class="row"><div><b>💧 Hydratation</b><div class="muted small">Repère quotidien simple</div></div><button class="btn gray" onclick="db.water++;save();render()">＋</button></div></div>${db.meals.length?db.meals.map(m=>`<div class="card"><b>${esc(m.name)}</b><div class="muted small">${esc(m.foods||"")}</div>${m.note?`<p class="small">${esc(m.note)}</p>`:""}</div>`).join(""):`<div class="card center muted">Aucun repas enregistré.</div>`}`}
let photo="";function addMeal(){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="m"><div class="sheet"><div class="row"><h2>Nouveau repas</h2><button class="btn gray" onclick="m.remove()">Fermer</button></div><label class="muted small">Photo</label><input id="pf" class="input full" type="file" accept="image/*" capture="environment"><div class="field"><label>Nom</label><input id="mn" class="input full" placeholder="Ex. Poulet, riz, légumes"></div><div class="field"><label>Aliments et quantités</label><textarea id="mf" class="input full" style="height:90px" placeholder="Ex. poulet 150 g..."></textarea></div><div class="field"><label>Note</label><textarea id="nt" class="input full" style="height:70px"></textarea></div><button class="btn full" onclick="mealSave()">Enregistrer</button></div></div>`)}
function mealSave(){db.meals.unshift({date:new Date().toISOString(),name:$("mn").value||"Repas",foods:$("mf").value,note:$("nt").value});save();m.remove();render();toast("Repas enregistré ✓")}
function stats(){return `<div class="title">Statistiques</div><div class="grid"><div class="stat"><div class="muted">Séances</div><b>${db.workouts.length}</b></div><div class="stat"><div class="muted">Volume</div><b>${Math.round(db.workouts.reduce((n,w)=>n+(w.volume||0),0))} kg</b></div></div>${db.exercises.map(e=>`<div class="card"><div class="row"><b>${esc(e.name)}</b><span class="pill">${best(e.id)||"—"} kg</span></div><div class="muted small" style="margin-top:8px">Record personnel enregistré</div></div>`).join("")}`}
function addEx(){let names=db.exercises.map(e=>e.name).join(", ");document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="m"><div class="sheet"><h2>Ajouter un exercice</h2><input id="en" class="input full" placeholder="Nom de l'exercice"><button class="btn full" style="margin-top:12px" onclick="let n=$('en').value.trim();if(n){db.exercises.push({id:'x'+Date.now(),name:n});save();m.remove();render()}">Ajouter</button></div></div>`)}
function $(x){return document.getElementById(x)}render();
</script></body></html>
